name: one-off-import-prod-delivery-group

# TEMPORARY, one-time-use workflow, repurposed 2026-09-16 - originally
# imported module.citrix.citrix_delivery_group.vda["prod"] into Terraform
# state (that import succeeded; see git history on this file for the
# 4-attempt saga of getting the Citrix Orchestration API call right).
#
# Repurposed here as a READ-ONLY dry run for
# scripts/citrix_daas_maintenance.py's `drain` command, ahead of rolling
# 2609-2 to Prod: that script's own docstring flags its Machines
# list/maintenance-mode/power-action endpoints as never verified against a
# live Citrix Cloud tenant, and citrix-image-rotation.yml's
# promote-to-prod-and-drain job calls its `drain` command directly against
# real Prod machines. This imports the same script's functions and calls
# only the read-only ones (get_token, resolve_catalog_id, list_machines,
# get_session_count) against a real, safe, non-prod target - test's
# already-drained-but-undecommissioned "driftwood-win11-test-2601-1"
# catalog. Never calls set_maintenance_mode or power_off - zero mutation
# risk.
#
# Kept at this file path (rather than a new file) because workflow_dispatch
# only discovers workflow files that exist on the default branch (main) -
# this path is already registered there from the original import use.
# Dispatched with --ref release/1.0.0 to run this repurposed content
# without needing another push to main (which would itself trigger
# promote-to-prod-and-drain against real Prod, defeating the point of a
# dry run). Delete this file (on both branches) once the real drain has
# been validated against Prod.

on:
  workflow_dispatch:
    inputs:
      catalog_name:
        description: "Machine catalog name to look up (read-only, no mutation)"
        required: true
        default: "driftwood-win11-test-2601-1"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look up catalog and list machines (read-only)
        env:
          CITRIX_CUSTOMER_ID: ${{ secrets.CITRIX_CUSTOMER_ID }}
          CITRIX_MAINTENANCE_CLIENT_ID: ${{ secrets.CITRIX_MAINTENANCE_CLIENT_ID }}
          CITRIX_MAINTENANCE_CLIENT_SECRET: ${{ secrets.CITRIX_MAINTENANCE_CLIENT_SECRET }}
          CATALOG_NAME: ${{ inputs.catalog_name }}
        run: |
          python3 - <<'PYEOF'
          import os
          import sys

          sys.path.insert(0, "scripts")
          from citrix_daas_maintenance import get_token, resolve_catalog_id, list_machines, get_session_count

          customer_id = os.environ["CITRIX_CUSTOMER_ID"]
          client_id = os.environ["CITRIX_MAINTENANCE_CLIENT_ID"]
          client_secret = os.environ["CITRIX_MAINTENANCE_CLIENT_SECRET"]
          catalog_name = os.environ["CATALOG_NAME"]

          token = get_token(customer_id, client_id, client_secret)
          print("Token acquired OK")

          catalog_id = resolve_catalog_id(token, customer_id, catalog_name)
          print(f"Resolved catalog {catalog_name!r} -> {catalog_id}")

          machines = list_machines(token, customer_id, catalog_id)
          print(f"Found {len(machines)} machine(s):")
          for m in machines:
              sessions = get_session_count(token, customer_id, m["Id"])
              print(f"  {m.get('Name')} (id={m['Id']}) - {sessions} session(s), InMaintenanceMode={m.get('InMaintenanceMode')}")
          PYEOF
