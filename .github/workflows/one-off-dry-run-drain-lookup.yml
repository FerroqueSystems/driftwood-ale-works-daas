name: one-off-dry-run-drain-lookup

# TEMPORARY, one-time-use workflow - delete once the real drain step in
# promote-to-prod-and-drain has been validated against a real Prod cutover.
#
# Context: scripts/citrix_daas_maintenance.py's own docstring flags its
# Machines list/maintenance-mode/power-action endpoints as never verified
# against a live Citrix Cloud tenant. Before trusting its `drain` command
# against real Prod machines (as promote-to-prod-and-drain does), this
# imports the same script's functions and calls only the READ-ONLY ones
# (get_token, resolve_catalog_id, list_machines, get_session_count) against
# a real, safe, non-prod target - test's already-drained-but-
# undecommissioned "driftwood-win11-test-2601-1" catalog. Never calls
# set_maintenance_mode or power_off - zero mutation risk.

on:
  workflow_dispatch:
    inputs:
      catalog_name:
        description: "Machine catalog name to look up (read-only, no mutation)"
        required: true
        default: "driftwood-win11-test-2601-1"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look up catalog and list machines (read-only)
        env:
          CITRIX_CUSTOMER_ID: ${{ secrets.CITRIX_CUSTOMER_ID }}
          CITRIX_MAINTENANCE_CLIENT_ID: ${{ secrets.CITRIX_MAINTENANCE_CLIENT_ID }}
          CITRIX_MAINTENANCE_CLIENT_SECRET: ${{ secrets.CITRIX_MAINTENANCE_CLIENT_SECRET }}
          CATALOG_NAME: ${{ inputs.catalog_name }}
        run: |
          python3 - <<'PYEOF'
          import os
          import sys

          sys.path.insert(0, "scripts")
          from citrix_daas_maintenance import get_token, resolve_catalog_id, list_machines, get_session_count

          customer_id = os.environ["CITRIX_CUSTOMER_ID"]
          client_id = os.environ["CITRIX_MAINTENANCE_CLIENT_ID"]
          client_secret = os.environ["CITRIX_MAINTENANCE_CLIENT_SECRET"]
          catalog_name = os.environ["CATALOG_NAME"]

          token = get_token(customer_id, client_id, client_secret)
          print("Token acquired OK")

          catalog_id = resolve_catalog_id(token, customer_id, catalog_name)
          print(f"Resolved catalog {catalog_name!r} -> {catalog_id}")

          machines = list_machines(token, customer_id, catalog_id)
          print(f"Found {len(machines)} machine(s):")
          for m in machines:
              sessions = get_session_count(token, customer_id, m["Id"])
              print(f"  {m.get('Name')} (id={m['Id']}) - {sessions} session(s), InMaintenanceMode={m.get('InMaintenanceMode')}")
          PYEOF
