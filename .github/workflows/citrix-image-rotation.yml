name: citrix-image-rotation

# GitFlow-driven golden image / machine catalog rotation, run independently
# per environment (dev/test/prod). One shared Packer build feeds all three
# environments; each cuts over to it on its own schedule:
#
# - Push to any feature/**, release/**, or hotfix/** branch -> build-and-
#   dev-cutover: builds a new golden image and immediately cuts Dev over to
#   it, fully automatic (see "Approval gates" below for what "automatic"
#   actually means once a required-reviewer environment is involved).
# - Push to develop (a working branch merged in) -> promote-to-test:
#   promotes whatever's currently live in Dev into Test - no new Packer
#   build, just staging + cutover against the already-published image.
# - Push to main (develop merged in) -> promote-to-prod-and-drain: same
#   promotion pattern, Test into Prod, then drains the outgoing Prod
#   catalog (maintenance mode -> bounded wait for sessions to clear ->
#   power off - see scripts/citrix_daas_maintenance.py) rather than
#   deleting it. Actual decommission of a drained catalog stays a separate,
#   later, manual step (below) - this only retires it from serving traffic.
# - workflow_dispatch actions (build/cutover/decommission/apply) remain for
#   manual, out-of-band operations - e.g. rebuilding one environment
#   in isolation, or the two-phase "stage now, cut over later" flow that
#   only really makes sense with a human in the loop between the two steps.
#
# Image labels are "<branch-slug>-<short-sha>" (e.g. "add-widget-a1b2c3d"),
# computed by the push-triggered jobs - NOT the "YYMM-N" scheme the manual
# workflow_dispatch build/cutover/decommission actions still use for their
# own inputs (both schemes coexist fine - catalog_rotation's entries are
# just opaque string keys either way). The corresponding Azure Compute
# Gallery version is a SEPARATE, purely numeric value
# ("<YYYYMM>.<run_number>.0") - no longer derived from the label string,
# since branch-slug labels aren't numeric. See
# scripts/rotate_image_versions.py's module docstring and
# modules/citrix/README.md for the full rotation-state model.
#
# There's no hard cap on how many labels can accumulate in one environment
# (the old --max-entries per-environment block was retired - it made sense
# at ~1 build/month, not at "every push"). Every job that touches
# catalog_rotation instead runs `check-outstanding`, which warns (never
# blocks) once more than 5 distinct labels are outstanding across all three
# environments combined - a nudge to decommission drained builds, not a
# gate.
#
# Approval gates: "cutover"-family jobs (including the three automatic ones
# above) run under environment: citrix-cutover-approval-<env>. Add a
# required reviewer to each in repo Settings > Environments - dev/test can
# be lighter-gated or ungated (so pushes to working branches/develop really
# do run unattended), prod should require a named reviewer. That means
# promote-to-prod-and-drain, despite triggering automatically on push to
# main, still pauses for that reviewer's approval before actually cutting
# Prod over and draining the old catalog - merging to main starts the
# pipeline, it doesn't bypass the human check.
# "decommission" is gated behind citrix-decommission-approval-<environment>.
# Deletes the fully-drained outgoing catalog/image version from that
# environment, and - only if no other environment still references the
# same build label - the underlying Azure Compute Gallery image version
# Packer published too (citrix_image_version only references that by
# pointer - terraform apply alone never deletes it, and it's deduped across
# environments, see modules/citrix/main.tf).
# "apply" is gated behind citrix-cutover-approval-prod (the strictest tier,
# since an untargeted apply can touch any environment's delivery-group
# config in one pass). Plain `terraform apply` with no
# rotation.auto.tfvars.json change - for delivery-group config (published
# desktop name, restricted access, autoscale schedule) that isn't part of
# the rotation state machine and has no other in-CI path to get applied.
#
# This workflow needs the full non-secret environment config (everything in
# terraform.tfvars.example) and the Packer build vars (everything in
# packer/images/win11-azure.pkrvars.hcl.example) available in CI, since both
# files are gitignored/local-only. Rather than one big JSON blob secret, each
# real value is its own named GitHub secret or variable (see the top-level
# README's secrets/variables table) - two local composite actions
# (.github/actions/write-citrix-tfvars, .github/actions/write-packer-vars)
# assemble them into gitignored *.auto.tfvars.json/*.auto.pkrvars.json files
# at runtime. The "Write Terraform vars"/"Write Packer build vars" steps
# below are defined once (in the "build" job) and reused via YAML anchors
# (&write_citrix_tfvars/&write_packer_vars, referenced as *write_citrix_tfvars/
# *write_packer_vars elsewhere) rather than repeating the same ~55-key
# `with:` block in every job that needs it.
#
# delivery_groups (dev/test/prod config - name, published desktop, access
# list, autoscale schedule) is split into three separately-named repo-level
# variables (DELIVERY_GROUP_DEV/TEST/PROD_CONFIG_JSON) rather than scoped to
# each environment's own GitHub Environment - a job declaring one
# environment (e.g. citrix-cutover-approval-test) cannot read another
# environment's scoped variables, but every apply needs the *complete*
# delivery_groups map (all three) regardless of which one it's cutting over,
# or Terraform destroys whichever environments are missing from it.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Rotation step to run"
        required: true
        type: choice
        options: [build, cutover, decommission, apply]
      environment:
        description: 'Environment to build/cut over/decommission - mirrors the paved-road promotion order (dev first, then test, then prod). Ignored by "apply" (applies pending delivery-group config drift across all environments in one pass).'
        required: true
        type: choice
        options: [dev, test, prod]
      image_label:
        description: 'Build label in "YYMM-N" form, e.g. "2607-1" (the label being built, cut over to, or decommissioned). Ignored by "apply" - put anything, e.g. the current live label.'
        required: true
      old_image_label:
        description: "cutover only: the outgoing build label to phase out (leave blank if this is the first-ever catalog in this environment)"
        required: false
      total_machines:
        description: "build only: number of machines to provision in the new catalog"
        required: false
      machine_count:
        description: "cutover only: number of machines to assign to the new catalog in the delivery group"
        required: false
  push:
    branches:
      - "feature/**"
      - "release/**"
      - "hotfix/**"
      - develop
      - main

concurrency:
  group: citrix-image-rotation-${{ github.ref }}
  # Never cancel mid-Packer-build or mid-`terraform apply` - either can
  # leave Azure/Citrix resources half-provisioned. Queue instead; push
  # triggers can fire in rapid bursts in a way manual, human-paced dispatch
  # never did.
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  TF_WORKDIR: environments/citrix-azure
  ROTATION_FILE: environments/citrix-azure/rotation.auto.tfvars.json
  # Fixed per-environment machine counts for the automatic push-triggered
  # jobs, since there's no human filling in a workflow_dispatch input for
  # those - repo Variables now (falling back to the original demo counts if
  # unset) instead of literals, so they're visible/adjustable from repo
  # Settings without a code change.
  DEV_TOTAL_MACHINES: ${{ vars.DEV_TOTAL_MACHINES || 3 }}
  TEST_TOTAL_MACHINES: ${{ vars.TEST_TOTAL_MACHINES || 5 }}
  PROD_TOTAL_MACHINES: ${{ vars.PROD_TOTAL_MACHINES || 20 }}
  OUTSTANDING_IMAGE_LABEL_THRESHOLD: ${{ vars.OUTSTANDING_IMAGE_LABEL_THRESHOLD || 5 }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'build'
    runs-on: ubuntu-latest
    environment: techops-monthly-daas
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Compute Azure Compute Gallery version from the build label
        id: version
        run: |
          IFS='-' read -r ym n <<< "${{ inputs.image_label }}"
          echo "gallery_version=${ym}.${n}.0" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - &write_citrix_tfvars
        name: Write Terraform vars
        uses: ./.github/actions/write-citrix-tfvars
        with:
          working_directory: ${{ env.TF_WORKDIR }}
          location: ${{ vars.LOCATION }}
          resource_group_name: ${{ vars.RESOURCE_GROUP_NAME }}
          tags_json: ${{ vars.TAGS_JSON }}
          enable_scheduled_shutdown: ${{ vars.ENABLE_SCHEDULED_SHUTDOWN }}
          scheduled_shutdown_time: ${{ vars.SCHEDULED_SHUTDOWN_TIME }}
          scheduled_shutdown_timezone: ${{ vars.SCHEDULED_SHUTDOWN_TIMEZONE }}
          vnet_name: ${{ vars.VNET_NAME }}
          vnet_address_space_json: ${{ vars.VNET_ADDRESS_SPACE_JSON }}
          vda_subnet_address_prefixes_json: ${{ vars.VDA_SUBNET_ADDRESS_PREFIXES_JSON }}
          hosting_connection_app_name: ${{ vars.HOSTING_CONNECTION_APP_NAME }}
          azure_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.ARM_TENANT_ID }}
          citrix_customer_id: ${{ secrets.CITRIX_CUSTOMER_ID }}
          citrix_client_id: ${{ secrets.CITRIX_CLIENT_ID }}
          citrix_environment: ${{ vars.CITRIX_ENVIRONMENT }}
          citrix_resource_location_name: ${{ vars.CITRIX_RESOURCE_LOCATION_NAME }}
          citrix_zone_description: ${{ vars.CITRIX_ZONE_DESCRIPTION }}
          citrix_hypervisor_name: ${{ vars.CITRIX_HYPERVISOR_NAME }}
          citrix_resource_pool_name: ${{ vars.CITRIX_RESOURCE_POOL_NAME }}
          delivery_group_dev_config_json: ${{ vars.DELIVERY_GROUP_DEV_CONFIG_JSON }}
          delivery_group_test_config_json: ${{ vars.DELIVERY_GROUP_TEST_CONFIG_JSON }}
          delivery_group_prod_config_json: ${{ vars.DELIVERY_GROUP_PROD_CONFIG_JSON }}
          citrix_allocation_type: ${{ vars.CITRIX_ALLOCATION_TYPE }}
          citrix_vda_service_offering: ${{ vars.CITRIX_VDA_SERVICE_OFFERING }}
          citrix_vda_storage_type: ${{ vars.CITRIX_VDA_STORAGE_TYPE }}
          active_directory_domain_fqdn: ${{ vars.ACTIVE_DIRECTORY_DOMAIN_FQDN }}
          active_directory_domain_netbios_name: ${{ vars.ACTIVE_DIRECTORY_DOMAIN_NETBIOS_NAME }}
          active_directory_safe_mode_password: ${{ secrets.ACTIVE_DIRECTORY_SAFE_MODE_PASSWORD }}
          active_directory_service_account_name: ${{ vars.ACTIVE_DIRECTORY_SERVICE_ACCOUNT_NAME }}
          active_directory_service_account_password: ${{ secrets.ACTIVE_DIRECTORY_SERVICE_ACCOUNT_PASSWORD }}
          active_directory_base_ou_name: ${{ vars.ACTIVE_DIRECTORY_BASE_OU_NAME }}
          active_directory_vda_ou_name: ${{ vars.ACTIVE_DIRECTORY_VDA_OU_NAME }}
          active_directory_connector_ou_name: ${{ vars.ACTIVE_DIRECTORY_CONNECTOR_OU_NAME }}
          active_directory_dev_desktop_group_name: ${{ vars.ACTIVE_DIRECTORY_DEV_DESKTOP_GROUP_NAME }}
          active_directory_test_desktop_group_name: ${{ vars.ACTIVE_DIRECTORY_TEST_DESKTOP_GROUP_NAME }}
          active_directory_prod_desktop_group_name: ${{ vars.ACTIVE_DIRECTORY_PROD_DESKTOP_GROUP_NAME }}
          domain_controller_admin_username: ${{ vars.DOMAIN_CONTROLLER_ADMIN_USERNAME }}
          domain_controller_admin_password: ${{ secrets.DOMAIN_CONTROLLER_ADMIN_PASSWORD }}
          domain_controller_scripts_storage_account_name: ${{ vars.DOMAIN_CONTROLLER_SCRIPTS_STORAGE_ACCOUNT_NAME }}
          cloud_connector_admin_username: ${{ vars.CLOUD_CONNECTOR_ADMIN_USERNAME }}
          cloud_connector_admin_password: ${{ secrets.CLOUD_CONNECTOR_ADMIN_PASSWORD }}
          cloud_connector_client_id: ${{ secrets.CLOUD_CONNECTOR_CLIENT_ID }}
          cloud_connector_client_secret: ${{ secrets.CLOUD_CONNECTOR_CLIENT_SECRET }}
          cloud_connector_installer_url: ${{ secrets.CLOUD_CONNECTOR_INSTALLER_URL }}
          cloud_connector_scripts_storage_account_name: ${{ vars.CLOUD_CONNECTOR_SCRIPTS_STORAGE_ACCOUNT_NAME }}
          github_runner_name: ${{ vars.GITHUB_RUNNER_NAME }}
          github_runner_vm_size: ${{ vars.GITHUB_RUNNER_VM_SIZE }}
          github_runner_admin_username: ${{ vars.GITHUB_RUNNER_ADMIN_USERNAME }}
          github_runner_admin_ssh_public_key: ${{ secrets.GITHUB_RUNNER_ADMIN_SSH_PUBLIC_KEY }}
          enable_runner_temporary_ssh_access: ${{ vars.ENABLE_RUNNER_TEMPORARY_SSH_ACCESS }}
          admin_source_ip_cidr: ${{ secrets.ADMIN_SOURCE_IP_CIDR }}
          gallery_name: ${{ vars.GALLERY_NAME }}
          image_definition_name: ${{ vars.IMAGE_DEFINITION_NAME }}
          image_sku: ${{ vars.IMAGE_SKU }}
          artifact_storage_account_name: ${{ vars.ARTIFACT_STORAGE_ACCOUNT_NAME }}
          artifact_storage_container_name: ${{ vars.ARTIFACT_STORAGE_CONTAINER_NAME }}

      # Packer only publishes a new image *version* into an already-existing
      # Shared Image Gallery/image definition (module.image_gallery) - it
      # never creates them. Apply first so those exist before the build, which
      # matters on a first-ever build where nothing has been applied yet.
      # Scoped to just module.image_gallery (not a full apply) because
      # var.catalog_rotation may already have this build's label staged (in
      # this or another environment) from rotation.auto.tfvars.json
      # (committed by a previous run of this same workflow) - an untargeted
      # apply here would try to create citrix_image_version for a gallery
      # image Packer hasn't published yet.
      - name: terraform apply (ensure prerequisites exist before the image build)
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          CITRIX_CLIENT_SECRET: ${{ secrets.CITRIX_CLIENT_SECRET }}
        run: |
          terraform init
          terraform apply -auto-approve -target=module.image_gallery

      - uses: hashicorp/setup-packer@main
        with:
          version: latest

      - &write_packer_vars
        name: Write Packer build vars
        uses: ./.github/actions/write-packer-vars
        with:
          working_directory: packer/images
          subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          location: ${{ vars.LOCATION }}
          resource_group_name: ${{ vars.RESOURCE_GROUP_NAME }}
          gallery_name: ${{ vars.GALLERY_NAME }}
          image_definition_name: ${{ vars.IMAGE_DEFINITION_NAME }}
          azure_imgpublisher: ${{ vars.AZURE_IMGPUBLISHER }}
          azure_imgoffer: ${{ vars.AZURE_IMGOFFER }}
          azure_imgsku: ${{ vars.AZURE_IMGSKU }}
          azure_imgversion: ${{ vars.AZURE_IMGVERSION }}
          install_chocolatey_packages: ${{ vars.INSTALL_CHOCOLATEY_PACKAGES }}
          chocolatey_packages_json: ${{ vars.CHOCOLATEY_PACKAGES_JSON }}
          install_m365_apps: ${{ vars.INSTALL_M365_APPS }}
          m365_apps_odt_url: ${{ vars.M365_APPS_ODT_URL }}
          install_citrix_vda: ${{ vars.INSTALL_CITRIX_VDA }}
          citrix_vda_installer_url: ${{ secrets.CITRIX_VDA_INSTALLER_URL }}
          citrix_vda_installer_args: ${{ vars.CITRIX_VDA_INSTALLER_ARGS }}
          install_cloudpaging_player: ${{ vars.INSTALL_CLOUDPAGING_PLAYER }}
          cloudpaging_player_installer_url: ${{ secrets.CLOUDPAGING_PLAYER_INSTALLER_URL }}
          cloudpaging_player_installer_args: ${{ vars.CLOUDPAGING_PLAYER_INSTALLER_ARGS }}
          run_citrix_optimizer: ${{ vars.RUN_CITRIX_OPTIMIZER }}
          citrix_optimizer_zip_url: ${{ secrets.CITRIX_OPTIMIZER_ZIP_URL }}
          citrix_optimizer_template_name: ${{ vars.CITRIX_OPTIMIZER_TEMPLATE_NAME }}
          prepare_for_citrix_mcs: ${{ vars.PREPARE_FOR_CITRIX_MCS }}
          local_admin_username: ${{ secrets.VDA_LOCAL_ADMIN_USERNAME }}
          local_admin_password: ${{ secrets.VDA_LOCAL_ADMIN_PASSWORD }}
          managed_image_tags_json: ${{ vars.MANAGED_IMAGE_TAGS_JSON }}

      # Re-running "build" (e.g. to retry a later step after Packer already
      # succeeded) would otherwise always fail here - Packer refuses to
      # publish a gallery image version that already exists rather than
      # silently treating it as done. Skip the ~15-20 minute rebuild if this
      # exact version is already published.
      - name: Check whether this image version was already published
        id: image_check
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          rg=$(python3 -c "import json; print(json.load(open('ci.auto.tfvars.json'))['resource_group_name'])")
          gallery=$(python3 -c "import json; print(json.load(open('ci.auto.tfvars.json'))['gallery_name'])")
          definition=$(python3 -c "import json; print(json.load(open('ci.auto.tfvars.json'))['image_definition_name'])")
          if az sig image-version show --resource-group "$rg" --gallery-name "$gallery" \
              --gallery-image-definition "$definition" \
              --gallery-image-version "${{ steps.version.outputs.gallery_version }}" \
              --query id -o tsv 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the golden image
        if: steps.image_check.outputs.exists != 'true'
        working-directory: packer/images
        env:
          LOCAL_ADMIN_USERNAME: ${{ secrets.VDA_LOCAL_ADMIN_USERNAME }}
          LOCAL_ADMIN_PASSWORD: ${{ secrets.VDA_LOCAL_ADMIN_PASSWORD }}
        run: |
          packer init azure-windows-base.pkr.hcl
          packer build \
            -var-file=ci.auto.pkrvars.json \
            -var "gallery_image_version=${{ steps.version.outputs.gallery_version }}" \
            -var "local_admin_username=$LOCAL_ADMIN_USERNAME" \
            -var "local_admin_password=$LOCAL_ADMIN_PASSWORD" \
            azure-windows-base.pkr.hcl

      - name: Stage the new machine catalog (machine_count 0)
        run: |
          naming_scheme=$(python3 -c "
          import json
          cfg = json.load(open('${{ env.TF_WORKDIR }}/ci.auto.tfvars.json'))
          print(cfg['delivery_groups']['${{ inputs.environment }}']['machine_naming_scheme'])
          ")
          catalog_name_prefix=$(python3 -c "
          import json
          cfg = json.load(open('${{ env.TF_WORKDIR }}/ci.auto.tfvars.json'))
          print(cfg['delivery_groups']['${{ inputs.environment }}']['catalog_name_prefix'])
          ")
          python3 scripts/rotate_image_versions.py "$ROTATION_FILE" build \
            --env "${{ inputs.environment }}" \
            --label "${{ inputs.image_label }}" \
            --gallery-version "${{ steps.version.outputs.gallery_version }}" \
            --total-machines "${{ inputs.total_machines }}" \
            --naming-scheme "$naming_scheme" \
            --catalog-name-prefix "$catalog_name_prefix"

      - name: Commit the rotation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$ROTATION_FILE"
          if git diff --staged --quiet; then
            echo "No changes to $ROTATION_FILE, skipping commit"
          else
            git commit -m "citrix-image-rotation: stage build ${{ inputs.image_label }}"
            git pull --rebase
            git push
          fi

      # Scoped to just this label's image_version/machine_catalog - an
      # untargeted apply here would also update citrix_delivery_group's
      # associated_machine_catalogs to add the new label at its staged
      # machine_count = 0, which Citrix rejects ("machine_count of the
      # associated catalog cannot be less than 1") since it's a brand new
      # association, not a drain of an existing one. The delivery group only
      # picks up the new catalog at cutover, once machine_count is >= 1.
      # image_version is keyed by label only (deduped across environments,
      # see modules/citrix/main.tf) - this is a no-op for it if another
      # environment already staged this same label. machine_catalog is keyed
      # by "<environment>-<label>".
      - name: terraform apply (create the machine catalog for the new image version)
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          CITRIX_CLIENT_SECRET: ${{ secrets.CITRIX_CLIENT_SECRET }}
        run: |
          terraform apply -auto-approve \
            -target="module.citrix.citrix_image_version.vda[\"${{ inputs.image_label }}\"]" \
            -target="module.citrix.citrix_machine_catalog.vda[\"${{ inputs.environment }}-${{ inputs.image_label }}\"]"

      - name: Check outstanding image labels
        run: python3 scripts/rotate_image_versions.py "$ROTATION_FILE" check-outstanding --threshold "$OUTSTANDING_IMAGE_LABEL_THRESHOLD"

  cutover:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'cutover'
    runs-on: ubuntu-latest
    environment: citrix-cutover-approval-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Cut the delivery group over to the new catalog
        run: |
          python3 scripts/rotate_image_versions.py "$ROTATION_FILE" cutover \
            --env "${{ inputs.environment }}" \
            --new-label "${{ inputs.image_label }}" \
            --machine-count "${{ inputs.machine_count }}" \
            ${{ inputs.old_image_label != '' && format('--old-label {0}', inputs.old_image_label) || '' }}

      - name: Commit the rotation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$ROTATION_FILE"
          if git diff --staged --quiet; then
            echo "No changes to $ROTATION_FILE, skipping commit"
          else
            git commit -m "citrix-image-rotation: cut over to ${{ inputs.image_label }}"
            git pull --rebase
            git push
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - *write_citrix_tfvars

      - name: terraform apply
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          CITRIX_CLIENT_SECRET: ${{ secrets.CITRIX_CLIENT_SECRET }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Check outstanding image labels
        run: python3 scripts/rotate_image_versions.py "$ROTATION_FILE" check-outstanding --threshold "$OUTSTANDING_IMAGE_LABEL_THRESHOLD"

  decommission:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'decommission'
    runs-on: ubuntu-latest
    environment: citrix-decommission-approval-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Remove the drained catalog/image version from this environment's rotation state
        id: decommission
        run: |
          python3 scripts/rotate_image_versions.py "$ROTATION_FILE" decommission \
            --env "${{ inputs.environment }}" \
            --label "${{ inputs.image_label }}"
          # citrix_image_version is deduped across environments (see
          # modules/citrix/main.tf) - only delete the underlying Azure
          # Compute Gallery image version below once NO environment still
          # references this label, otherwise this would rip the shared
          # image out from under an environment still live on it.
          still_referenced=$(python3 -c "
          import json
          data = json.load(open('$ROTATION_FILE'))
          label = '${{ inputs.image_label }}'
          print('true' if any(label in envmap for envmap in data['catalog_rotation'].values()) else 'false')
          ")
          echo "still_referenced=$still_referenced" >> "$GITHUB_OUTPUT"

      - name: Commit the rotation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$ROTATION_FILE"
          if git diff --staged --quiet; then
            echo "No changes to $ROTATION_FILE, skipping commit"
          else
            git commit -m "citrix-image-rotation: decommission ${{ inputs.image_label }}"
            git pull --rebase
            git push
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - *write_citrix_tfvars

      - name: terraform apply
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          CITRIX_CLIENT_SECRET: ${{ secrets.CITRIX_CLIENT_SECRET }}
        run: |
          terraform init
          terraform apply -auto-approve

      # citrix_image_version only wraps a *reference* to the Azure Compute
      # Gallery image version by pointer (gallery/definition/version) - it
      # doesn't own that Azure resource's lifecycle, since Packer publishes
      # gallery image versions directly, outside Terraform. So the apply
      # above never deletes the underlying gallery image version - it just
      # accumulates forever unless removed here explicitly. gallery_image_version
      # comes from the rotation state itself (via the decommission step's
      # output above), not re-derived from the label string - labels aren't
      # guaranteed to encode a version anymore (see the push-triggered jobs'
      # branch-slug labels below).
      - name: Delete the Azure Compute Gallery image version
        if: steps.decommission.outputs.still_referenced != 'true'
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          rg=$(python3 -c "import json; print(json.load(open('ci.auto.tfvars.json'))['resource_group_name'])")
          gallery=$(python3 -c "import json; print(json.load(open('ci.auto.tfvars.json'))['gallery_name'])")
          definition=$(python3 -c "import json; print(json.load(open('ci.auto.tfvars.json'))['image_definition_name'])")
          az sig image-version delete \
            --resource-group "$rg" \
            --gallery-name "$gallery" \
            --gallery-image-definition "$definition" \
            --gallery-image-version "${{ steps.decommission.outputs.gallery_image_version }}"

      - name: Check outstanding image labels
        run: python3 scripts/rotate_image_versions.py "$ROTATION_FILE" check-outstanding --threshold "$OUTSTANDING_IMAGE_LABEL_THRESHOLD"

  # Split into a plan job and an apply job that applies exactly the saved
  # plan, both gated behind citrix-cutover-approval-prod (the strictest
  # tier - an untargeted apply here can touch any environment's
  # delivery-group config in one pass, not just the "environment" input,
  # which this action ignores) - so the reviewer sees two prompts: approving
  # "plan" is low-stakes (read-only, no mutation) and unlocks the actual
  # plan output; only then do they approve "apply" with the real change
  # already visible, instead of approving blind and finding out what
  # happened after terraform apply -auto-approve already ran.
  # (ARM_CLIENT_ID/ARM_TENANT_ID/ARM_SUBSCRIPTION_ID/CITRIX_CLIENT_SECRET
  # are environment-scoped secrets - a job can't read them without
  # declaring that environment, and declaring it always gates the whole
  # job, so plan can't be made to run unattended while still using these
  # credentials.)
  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: citrix-cutover-approval-prod
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - *write_citrix_tfvars

      - name: terraform plan
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          CITRIX_CLIENT_SECRET: ${{ secrets.CITRIX_CLIENT_SECRET }}
        run: |
          terraform init
          terraform plan -out=tfplan
          terraform show -no-color tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKDIR }}/tfplan
          retention-days: 1

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    environment: citrix-cutover-approval-prod
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - *write_citrix_tfvars

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKDIR }}

      - name: terraform apply (the plan reviewed in the "plan" job above)
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          CITRIX_CLIENT_SECRET: ${{ secrets.CITRIX_CLIENT_SECRET }}
        run: |
          terraform init
          terraform apply tfplan

  build-and-dev-cutover:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/'))
    runs-on: ubuntu-latest
    environment: citrix-cutover-approval-dev
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - *write_citrix_tfvars

      # Branch-slug + short-SHA label, decoupled from the Azure Compute
      # Gallery version below - see this workflow's header comment. The
      # slug's length budget is computed against dev's actual
      # catalog_name_prefix (catalog names are "<prefix>-<label>") rather
      # than a flat constant. Citrix's actual machine-catalog name limit
      # isn't published/confirmed anywhere we could find - 64 is a
      # conservative, commonly-cited Citrix object-name ceiling; adjust
      # this constant if a real test proves otherwise.
      - name: Compute image label and gallery version
        id: version
        run: |
          catalog_name_prefix=$(python3 -c "
          import json
          cfg = json.load(open('${{ env.TF_WORKDIR }}/ci.auto.tfvars.json'))
          print(cfg['delivery_groups']['dev']['catalog_name_prefix'])
          ")
          branch="${GITHUB_REF#refs/heads/}"
          slug=$(printf '%s' "$branch" \
            | sed -E 's#^(feature|release|hotfix)/##' \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          [ -z "$slug" ] && slug="branch"
          sha="${GITHUB_SHA:0:7}"
          budget=$(( 64 - ${#catalog_name_prefix} - 2 - ${#sha} ))
          if [ "${#slug}" -gt "$budget" ] && [ "$budget" -gt 0 ]; then
            slug=$(printf '%s' "$slug" | cut -c1-"$budget" | sed -E 's/-+$//')
          fi
          echo "image_label=${slug}-${sha}" >> "$GITHUB_OUTPUT"
          echo "gallery_version=$(date +%Y%m).${{ github.run_number }}.0" >> "$GITHUB_OUTPUT"

      # Packer only publishes a new image *version* into an already-existing
      # Shared Image Gallery/image definition - see the manual "build" job's
      # identical step above for why this is scoped to just module.image_gallery.
      - name: terraform apply (ensure prerequisites exist before the image build)
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          CITRIX_CLIENT_SECRET: ${{ secrets.CITRIX_CLIENT_SECRET }}
        run: |
          terraform init
          terraform apply -auto-approve -target=module.image_gallery

      - uses: hashicorp/setup-packer@main
        with:
          version: latest

      - *write_packer_vars

      - name: Check whether this image version was already published
        id: image_check
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          rg=$(python3 -c "import json; print(json.load(open('ci.auto.tfvars.json'))['resource_group_name'])")
          gallery=$(python3 -c "import json; print(json.load(open('ci.auto.tfvars.json'))['gallery_name'])")
          definition=$(python3 -c "import json; print(json.load(open('ci.auto.tfvars.json'))['image_definition_name'])")
          if az sig image-version show --resource-group "$rg" --gallery-name "$gallery" \
              --gallery-image-definition "$definition" \
              --gallery-image-version "${{ steps.version.outputs.gallery_version }}" \
              --query id -o tsv 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the golden image
        if: steps.image_check.outputs.exists != 'true'
        working-directory: packer/images
        env:
          LOCAL_ADMIN_USERNAME: ${{ secrets.VDA_LOCAL_ADMIN_USERNAME }}
          LOCAL_ADMIN_PASSWORD: ${{ secrets.VDA_LOCAL_ADMIN_PASSWORD }}
        run: |
          packer init azure-windows-base.pkr.hcl
          packer build \
            -var-file=ci.auto.pkrvars.json \
            -var "gallery_image_version=${{ steps.version.outputs.gallery_version }}" \
            -var "local_admin_username=$LOCAL_ADMIN_USERNAME" \
            -var "local_admin_password=$LOCAL_ADMIN_PASSWORD" \
            azure-windows-base.pkr.hcl

      - name: Stage the new machine catalog (machine_count 0)
        run: |
          naming_scheme=$(python3 -c "
          import json
          cfg = json.load(open('${{ env.TF_WORKDIR }}/ci.auto.tfvars.json'))
          print(cfg['delivery_groups']['dev']['machine_naming_scheme'])
          ")
          catalog_name_prefix=$(python3 -c "
          import json
          cfg = json.load(open('${{ env.TF_WORKDIR }}/ci.auto.tfvars.json'))
          print(cfg['delivery_groups']['dev']['catalog_name_prefix'])
          ")
          python3 scripts/rotate_image_versions.py "$ROTATION_FILE" build \
            --env dev \
            --label "${{ steps.version.outputs.image_label }}" \
            --gallery-version "${{ steps.version.outputs.gallery_version }}" \
            --total-machines "$DEV_TOTAL_MACHINES" \
            --naming-scheme "$naming_scheme" \
            --catalog-name-prefix "$catalog_name_prefix"

      - name: Find dev's outgoing label, if any
        id: outgoing
        run: python3 scripts/rotate_image_versions.py "$ROTATION_FILE" current-live --env dev --exclude "${{ steps.version.outputs.image_label }}"

      - name: Cut dev over to the new catalog
        run: |
          python3 scripts/rotate_image_versions.py "$ROTATION_FILE" cutover \
            --env dev \
            --new-label "${{ steps.version.outputs.image_label }}" \
            --machine-count "$DEV_TOTAL_MACHINES" \
            ${{ steps.outgoing.outputs.label != '' && format('--old-label {0}', steps.outgoing.outputs.label) || '' }}

      - name: Commit the rotation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$ROTATION_FILE"
          if git diff --staged --quiet; then
            echo "No changes to $ROTATION_FILE, skipping commit"
          else
            git commit -m "citrix-image-rotation: dev build+cutover to ${{ steps.version.outputs.image_label }}"
            git pull --rebase
            git push
          fi

      # ONE untargeted apply - safe here (unlike the manual build job's
      # careful -target scoping) because both the staging (machine_count=0)
      # and cutover (machine_count=N) edits already landed in the JSON
      # above, before Terraform ever runs. There's no intermediate state
      # where the delivery group would be asked to associate a catalog at
      # machine_count=0 (Citrix's actual rejection case) - Terraform only
      # ever sees the final, already-cut-over contents.
      - name: terraform apply
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          CITRIX_CLIENT_SECRET: ${{ secrets.CITRIX_CLIENT_SECRET }}
        run: terraform apply -auto-approve

      - name: Check outstanding image labels
        run: python3 scripts/rotate_image_versions.py "$ROTATION_FILE" check-outstanding --threshold "$OUTSTANDING_IMAGE_LABEL_THRESHOLD"

  promote-to-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: citrix-cutover-approval-test
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - *write_citrix_tfvars

      # No Packer build here - the image being promoted is already
      # published (dev already cut over to it). This job only stages+cuts
      # over test to reference the same, already-existing gallery image
      # version. The triggering push's own SHA (a merge commit on develop)
      # is unrelated to the label that was computed on the original feature
      # branch - so this looks up "what's currently live in dev" instead of
      # recomputing anything from its own git context.
      - name: Find what's currently live in dev
        id: source
        run: python3 scripts/rotate_image_versions.py "$ROTATION_FILE" current-live --env dev --required

      - name: Stage the promoted label in test (machine_count starts 0)
        run: |
          naming_scheme=$(python3 -c "
          import json
          cfg = json.load(open('${{ env.TF_WORKDIR }}/ci.auto.tfvars.json'))
          print(cfg['delivery_groups']['test']['machine_naming_scheme'])
          ")
          catalog_name_prefix=$(python3 -c "
          import json
          cfg = json.load(open('${{ env.TF_WORKDIR }}/ci.auto.tfvars.json'))
          print(cfg['delivery_groups']['test']['catalog_name_prefix'])
          ")
          python3 scripts/rotate_image_versions.py "$ROTATION_FILE" build \
            --env test \
            --label "${{ steps.source.outputs.label }}" \
            --gallery-version "${{ steps.source.outputs.gallery_image_version }}" \
            --total-machines "$TEST_TOTAL_MACHINES" \
            --naming-scheme "$naming_scheme" \
            --catalog-name-prefix "$catalog_name_prefix"

      - name: Find test's outgoing label, if any
        id: outgoing
        run: python3 scripts/rotate_image_versions.py "$ROTATION_FILE" current-live --env test --exclude "${{ steps.source.outputs.label }}"

      - name: Cut test over to the promoted label
        run: |
          python3 scripts/rotate_image_versions.py "$ROTATION_FILE" cutover \
            --env test \
            --new-label "${{ steps.source.outputs.label }}" \
            --machine-count "$TEST_TOTAL_MACHINES" \
            ${{ steps.outgoing.outputs.label != '' && format('--old-label {0}', steps.outgoing.outputs.label) || '' }}

      - name: Commit the rotation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$ROTATION_FILE"
          if git diff --staged --quiet; then
            echo "No changes to $ROTATION_FILE, skipping commit"
          else
            git commit -m "citrix-image-rotation: promote ${{ steps.source.outputs.label }} to test"
            git pull --rebase
            git push
          fi

      # Single untargeted apply - same "no observable intermediate zero
      # state" reasoning as build-and-dev-cutover above.
      - name: terraform apply
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          CITRIX_CLIENT_SECRET: ${{ secrets.CITRIX_CLIENT_SECRET }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Check outstanding image labels
        run: python3 scripts/rotate_image_versions.py "$ROTATION_FILE" check-outstanding --threshold "$OUTSTANDING_IMAGE_LABEL_THRESHOLD"

  promote-to-prod-and-drain:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: citrix-cutover-approval-prod
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - *write_citrix_tfvars

      - name: Find what's currently live in test
        id: source
        run: python3 scripts/rotate_image_versions.py "$ROTATION_FILE" current-live --env test --required

      - name: Stage the promoted label in prod (machine_count starts 0)
        run: |
          naming_scheme=$(python3 -c "
          import json
          cfg = json.load(open('${{ env.TF_WORKDIR }}/ci.auto.tfvars.json'))
          print(cfg['delivery_groups']['prod']['machine_naming_scheme'])
          ")
          catalog_name_prefix=$(python3 -c "
          import json
          cfg = json.load(open('${{ env.TF_WORKDIR }}/ci.auto.tfvars.json'))
          print(cfg['delivery_groups']['prod']['catalog_name_prefix'])
          ")
          python3 scripts/rotate_image_versions.py "$ROTATION_FILE" build \
            --env prod \
            --label "${{ steps.source.outputs.label }}" \
            --gallery-version "${{ steps.source.outputs.gallery_image_version }}" \
            --total-machines "$PROD_TOTAL_MACHINES" \
            --naming-scheme "$naming_scheme" \
            --catalog-name-prefix "$catalog_name_prefix"

      # Captured BEFORE cutover overwrites its machine_count to 0 - this is
      # what the drain step below targets.
      - name: Find prod's outgoing catalog, if any
        id: outgoing
        run: python3 scripts/rotate_image_versions.py "$ROTATION_FILE" current-live --env prod --exclude "${{ steps.source.outputs.label }}"

      - name: Cut prod over to the promoted label
        run: |
          python3 scripts/rotate_image_versions.py "$ROTATION_FILE" cutover \
            --env prod \
            --new-label "${{ steps.source.outputs.label }}" \
            --machine-count "$PROD_TOTAL_MACHINES" \
            ${{ steps.outgoing.outputs.label != '' && format('--old-label {0}', steps.outgoing.outputs.label) || '' }}

      - name: Commit the rotation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$ROTATION_FILE"
          if git diff --staged --quiet; then
            echo "No changes to $ROTATION_FILE, skipping commit"
          else
            git commit -m "citrix-image-rotation: promote ${{ steps.source.outputs.label }} to prod"
            git pull --rebase
            git push
          fi

      - name: terraform apply
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          CITRIX_CLIENT_SECRET: ${{ secrets.CITRIX_CLIENT_SECRET }}
        run: |
          terraform init
          terraform apply -auto-approve

      # Retires the outgoing Prod catalog from serving traffic without
      # deleting anything - actual decommission is still the separate,
      # manual workflow_dispatch action above, run whenever the operator is
      # ready. Uses Citrix's DaaS REST API directly (not Terraform - the
      # citrix/citrix provider has no per-machine maintenance-mode support,
      # see scripts/citrix_daas_maintenance.py's module docstring for why).
      # Bounded wait: whatever drains within the timeout gets powered off;
      # anything still occupied is left running, untouched, for manual
      # follow-up - this never forces a user's session closed.
      - name: Drain and power off the outgoing prod catalog's machines
        id: drain
        if: steps.outgoing.outputs.label != ''
        env:
          CITRIX_MAINTENANCE_CLIENT_ID: ${{ secrets.CITRIX_MAINTENANCE_CLIENT_ID }}
          CITRIX_MAINTENANCE_CLIENT_SECRET: ${{ secrets.CITRIX_MAINTENANCE_CLIENT_SECRET }}
        run: |
          customer_id=$(python3 -c "
          import json
          print(json.load(open('${{ env.TF_WORKDIR }}/ci.auto.tfvars.json'))['citrix_customer_id'])
          ")
          python3 scripts/citrix_daas_maintenance.py drain \
            --customer-id "$customer_id" \
            --catalog-name "${{ steps.outgoing.outputs.catalog_name }}" \
            --timeout-minutes 45 \
            --poll-interval-seconds 60

      - name: Warn about machines that didn't drain in time
        if: steps.drain.outputs.still_occupied_count > 0
        run: |
          echo "::warning::${{ steps.drain.outputs.still_occupied_count }} machine(s) in ${{ steps.outgoing.outputs.catalog_name }} still had active sessions after the drain timeout: ${{ steps.drain.outputs.still_occupied_machines }} - left running, needs manual follow-up."

      - name: Check outstanding image labels
        run: python3 scripts/rotate_image_versions.py "$ROTATION_FILE" check-outstanding --threshold "$OUTSTANDING_IMAGE_LABEL_THRESHOLD"
